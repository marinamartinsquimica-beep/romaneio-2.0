name: Testes de estoques main
on:
  push:
    branches: [main]
    paths:
      - 'integracao/**'
      - '.github/workflows/testes-estoques-main.yml'
  workflow_dispatch:
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Testar importacao e conferencia
        run: node --test integracao/{leitor-paripassu,paripassu-integracao,conferencia-estoques,contrato-estoques,publicacao-estoques,selecao-romaneios,baixa-transacional,filtro-expedicoes-baixadas}.test.mjs

